services:

  # The official image applies RABBITMQ_DEFAULT_* only on the first boot of an
  # empty volume, so a changed password or vhost would be ignored without a
  # word. The entrypoint therefore reconciles user, vhost and permissions on
  # every boot, and writes the disk limit into conf.d - there is no env var
  # for it (RABBITMQ_DISK_FREE_LIMIT is not honoured).
  # Every CLI call goes through `gosu rabbitmq`: as root it would create a
  # root-owned /var/lib/rabbitmq/.erlang.cookie after the entrypoint chowns
  # the data dir, and the server, running as rabbitmq, dies with eacces.
  # The marker file gates the healthcheck, so a failed reconcile keeps the
  # container unhealthy instead of letting clients onto a half-set-up broker.
  rabbitmq:
    image: rabbitmq:${RABBITMQ_VERSION:-4.1.3}-management
    restart: unless-stopped
    # Mandatory. Mnesia lives in /var/lib/rabbitmq/mnesia/rabbit@<hostname>,
    # so without a pinned hostname every recreate boots an empty database and
    # abandons the previous one inside the volume.
    hostname: rabbitmq
    networks:
      - default
      - proxy
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-user}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:?err}
      - RABBITMQ_DEFAULT_VHOST=${RABBITMQ_VHOST:-centrifugo}
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    # The AMQP port is NOT published. Publishers inside this stack, or on the
    # same docker network, reach the broker as rabbitmq:5672 and need no
    # published port. Uncomment the two lines below only to let a publisher
    # from outside the host in, for testing. The traffic is plain AMQP with no
    # TLS, and a published docker port bypasses the INPUT chain of the host
    # firewall, so the rule restricting it has to live in DOCKER-USER; without
    # such a rule the broker is open to the whole internet.
    # ports:
    #   - "5672:5672"
    entrypoint:
      - /bin/bash
      - -c
      - |
        cat > /etc/rabbitmq/conf.d/20-ispa.conf <<'RABBITMQ_CONFIG'
        disk_free_limit.absolute = ${RABBITMQ_DISK_FREE_ABSOLUTE_LIMIT:-1GB}
        RABBITMQ_CONFIG
        (
          U="$$RABBITMQ_DEFAULT_USER"
          P="$$RABBITMQ_DEFAULT_PASS"
          V="$$RABBITMQ_DEFAULT_VHOST"
          until gosu rabbitmq rabbitmq-diagnostics -q check_running \
              >/dev/null 2>&1; do
            sleep 3
          done
          gosu rabbitmq rabbitmqctl add_vhost "$$V" >/dev/null 2>&1 || true
          gosu rabbitmq rabbitmqctl set_permissions \
            -p "$$V" "$$U" ".*" ".*" ".*" &&
          gosu rabbitmq rabbitmqctl change_password "$$U" "$$P" &&
          touch /tmp/ispa-reconciled
        ) &
        exec docker-entrypoint.sh rabbitmq-server
    healthcheck:
      test: gosu rabbitmq rabbitmq-diagnostics -q ping &&
        test -f /tmp/ispa-reconciled
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"

      # Management UI on its own host. A Path()/PathPrefix() rule does not
      # work here - the management plugin needs its own `path_prefix` to
      # run under a subpath, and assets break without it.
      - "traefik.http.routers.${STACKNAME:?err}-rabbitmq.entrypoints=http"
      - "traefik.http.routers.${STACKNAME:?err}-rabbitmq.rule=Host(`${RABBITMQ_URL:?err}`)"
      - "traefik.http.middlewares.${STACKNAME:?err}-rabbitmq-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.${STACKNAME:?err}-rabbitmq-ipallowlist.ipallowlist.sourcerange=${RABBITMQ_IP_WHITELIST:-0.0.0.0/0}"
      - "traefik.http.routers.${STACKNAME:?err}-rabbitmq.middlewares=${STACKNAME:?err}-rabbitmq-https-redirect"
      - "traefik.http.routers.${STACKNAME:?err}-rabbitmq-secure.entrypoints=https"
      - "traefik.http.routers.${STACKNAME:?err}-rabbitmq-secure.rule=Host(`${RABBITMQ_URL:?err}`)"
      - "traefik.http.routers.${STACKNAME:?err}-rabbitmq-secure.middlewares=${STACKNAME:?err}-rabbitmq-ipallowlist"
      - "traefik.http.routers.${STACKNAME:?err}-rabbitmq-secure.tls=true"
      - "traefik.http.routers.${STACKNAME:?err}-rabbitmq-secure.tls.certresolver=http"
      - "traefik.http.routers.${STACKNAME:?err}-rabbitmq-secure.service=${STACKNAME:?err}-rabbitmq"
      - "traefik.http.services.${STACKNAME:?err}-rabbitmq.loadbalancer.server.port=15672"

  centrifugo:
    image: centrifugo/centrifugo:${CENTRIFUGO_VERSION:-v6}
    restart: unless-stopped
    networks:
      - default
      - proxy
    environment:
      - CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY=${CENTRIFUGO_HMAC_SECRET:?err}
      # Allowed browser Origins. This is the Origin header sent by the page
      # that opens the WebSocket - the URL of the web app, not of Centrifugo
      # itself. The list is SPACE separated; a comma separated value is
      # parsed as one single origin and then every connection is rejected
      # with HTTP 403. For example:
      #   CENTRIFUGO_ALLOWED_ORIGINS=https://app.example.com
      #   CENTRIFUGO_ALLOWED_ORIGINS=https://a.example.com https://b.example.com
      # The default "*" allows any origin; Centrifugo warns about it on
      # startup and it should only be used for testing.
      - CENTRIFUGO_CLIENT_ALLOWED_ORIGINS=${CENTRIFUGO_ALLOWED_ORIGINS:-*}
      - CENTRIFUGO_HTTP_API_KEY=${CENTRIFUGO_API_KEY:?err}
      - CENTRIFUGO_ADMIN_ENABLED=${CENTRIFUGO_ADMIN_ENABLED:-true}
      - CENTRIFUGO_ADMIN_PASSWORD=${CENTRIFUGO_ADMIN_PASSWORD:?err}
      - CENTRIFUGO_ADMIN_SECRET=${CENTRIFUGO_ADMIN_SECRET:?err}
      # Channels are grouped into namespaces; a channel name is
      # "<namespace>:<rest>", for example crm:user#42. Only namespaces listed
      # here exist - publishing into an unknown one is rejected. The value is
      # a JSON array as Centrifugo expects it; the JSON braces do not clash
      # with the ${VAR:-default} expansion, compose balances them. Add an app
      # by appending {"name":"<app>"}.
      - CENTRIFUGO_CHANNEL_NAMESPACES=${CENTRIFUGO_CHANNEL_NAMESPACES:-[{"name":"crm"},{"name":"nms"},{"name":"ipr"},{"name":"mapping"},{"name":"marketing"}]}
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"

      # This host serves the WebSocket endpoint, the HTTP API and the admin
      # UI on one port, so an IP allowlist here also cuts off the browser
      # clients. Keep it open and rely on CENTRIFUGO_API_KEY and
      # CENTRIFUGO_ADMIN_PASSWORD, or set CENTRIFUGO_ADMIN_ENABLED=false.
      - "traefik.http.routers.${STACKNAME:?err}-centrifugo.entrypoints=http"
      - "traefik.http.routers.${STACKNAME:?err}-centrifugo.rule=Host(`${CENTRIFUGO_URL:?err}`)"
      - "traefik.http.middlewares.${STACKNAME:?err}-centrifugo-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.${STACKNAME:?err}-centrifugo-ipallowlist.ipallowlist.sourcerange=${CENTRIFUGO_IP_WHITELIST:-0.0.0.0/0}"
      - "traefik.http.routers.${STACKNAME:?err}-centrifugo.middlewares=${STACKNAME:?err}-centrifugo-https-redirect"
      - "traefik.http.routers.${STACKNAME:?err}-centrifugo-secure.entrypoints=https"
      - "traefik.http.routers.${STACKNAME:?err}-centrifugo-secure.rule=Host(`${CENTRIFUGO_URL:?err}`)"
      - "traefik.http.routers.${STACKNAME:?err}-centrifugo-secure.middlewares=${STACKNAME:?err}-centrifugo-ipallowlist"
      - "traefik.http.routers.${STACKNAME:?err}-centrifugo-secure.tls=true"
      - "traefik.http.routers.${STACKNAME:?err}-centrifugo-secure.tls.certresolver=http"
      - "traefik.http.routers.${STACKNAME:?err}-centrifugo-secure.service=${STACKNAME:?err}-centrifugo"
      - "traefik.http.services.${STACKNAME:?err}-centrifugo.loadbalancer.server.port=8000"

  # Forwards messages from the RabbitMQ queue into Centrifugo channels.
  # Portainer deploys the stackfile alone, so the Benthos config cannot be a
  # bind mount - it is written into the container at startup instead. The
  # $${VAR} escapes keep the values out of the rendered YAML, so Benthos
  # expands them from its own environment at runtime.
  benthos:
    image: jeffail/benthos:${BENTHOS_VERSION:-4}
    restart: unless-stopped
    networks:
      - default
    depends_on:
      rabbitmq:
        condition: service_healthy
      centrifugo:
        condition: service_started
    environment:
      - RABBITMQ_USER=${RABBITMQ_USER:-user}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:?err}
      - RABBITMQ_VHOST=${RABBITMQ_VHOST:-centrifugo}
      - CENTRIFUGO_API_KEY=${CENTRIFUGO_API_KEY:?err}
    entrypoint:
      - /bin/sh
      - -c
      - |
        cat > /tmp/benthos.yaml <<'BENTHOS_CONFIG'
        input:
          amqp_0_9:
            # A password containing URL reserved characters (@ : / ?) would
            # have to be percent-encoded here, so prefer an alphanumeric one.
            urls:
              - "amqp://$${RABBITMQ_USER}:$${RABBITMQ_PASSWORD}@rabbitmq:5672/$${RABBITMQ_VHOST}"
            queue: "${RABBITMQ_QUEUE:-centrifugo_events}"
            queue_declare:
              enabled: true
              durable: true
            consumer_tag: "benthos_centrifugo_forwarder"

        pipeline:
          processors:
            # Input message shape: {"channel": "...", "payload": {...}}
            # Centrifugo v4+ takes the publish params at the root of the
            # body. Wrapping them in {"params": {...}} is the v2/v3 API
            # format, which v6 answers with HTTP 200 and an error in the
            # body - so a wrong shape here fails silently.
            - mapping: |
                root.channel = this.channel
                root.data = this.payload

        output:
          http_client:
            url: "http://centrifugo:8000/api/publish"
            verb: POST
            headers:
              Content-Type: "application/json"
              X-API-Key: "$${CENTRIFUGO_API_KEY}"
        BENTHOS_CONFIG
        exec /benthos -c /tmp/benthos.yaml

# ---------------------------------------------------------------------
# OPTIONAL self-test page - commented out on purpose. To switch it on,
# delete just the leading "#" from each line of the service block below
# (nothing else - the indentation is already correct) and add the three
# variables it needs to the template's env array.
#
# It is one page with one button that verifies the whole RabbitMQ ->
# Benthos -> Centrifugo -> browser chain and says in plain words what is
# broken when it is not green. Its last check runs from the visitor's
# browser against the PUBLIC Centrifugo URL, so it covers Traefik, TLS and
# the WebSocket upgrade as well, not just the internal docker network.
