services:
  postgres:
    image: timescale/timescaledb:${TIMESCALEDB_TAG:?err}
    restart: unless-stopped
    networks:
      - default
    #ports:
    #  # outside:inside
    #  - ${POSTGRES_EXTERNAL_PORT:-5432}:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${STACKNAME:?err}"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      TZ: Europe/Prague
      PGTZ: Europe/Prague
      POSTGRES_USER: ${STACKNAME:?err}
      POSTGRES_DB: ${STACKNAME:?err}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?err}
    volumes:
      - db:/var/lib/postgresql/data

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:${ZABBIX_TAG:?err}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "nc -w1 -z 127.0.0.1 10051 </dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    # uncomment only if zabbix_sender or active agents outside this stack need the trapper
    #ports:
    #  # outside:inside
    #  - ${ZBX_TRAPPER_EXTERNAL_PORT:-10051}:10051
    environment:
      TZ: Europe/Prague
      DB_SERVER_HOST: postgres
      POSTGRES_USER: ${STACKNAME:?err}
      POSTGRES_DB: ${STACKNAME:?err}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?err}
      # on DB init the entrypoint runs CREATE EXTENSION timescaledb + timescaledb.sql
      # (hypertables + compression policies) — applies to a fresh empty DB only
      ENABLE_TIMESCALEDB: "true"
      # Tuning defaults target roughly 1300 hosts / 130 new values per second.
      # Lower them for a small install; every value can be set from Portainer.
      # configuration cache — holds hosts, items and triggers
      ZBX_CACHESIZE: ${ZBX_CACHESIZE:-256M}
      # write buffers — absorb a stall in writes to the database
      ZBX_HISTORYCACHESIZE: ${ZBX_HISTORYCACHESIZE:-64M}
      ZBX_HISTORYINDEXCACHESIZE: ${ZBX_HISTORYINDEXCACHESIZE:-16M}
      # read caches — serve trigger expressions without hitting the database
      ZBX_VALUECACHESIZE: ${ZBX_VALUECACHESIZE:-128M}
      ZBX_TRENDCACHESIZE: ${ZBX_TRENDCACHESIZE:-32M}
      # polling capacity
      ZBX_STARTPOLLERS: ${ZBX_STARTPOLLERS:-20}
      ZBX_STARTSNMPPOLLERS: ${ZBX_STARTSNMPPOLLERS:-5}
      ZBX_STARTPINGERS: ${ZBX_STARTPINGERS:-20}
      # unreachable pollers retry hosts that are down; raise together with
      # ZBX_UNAVAILABLEDELAY when a lot of hosts stay permanently unreachable
      ZBX_STARTPOLLERSUNREACHABLE: ${ZBX_STARTPOLLERSUNREACHABLE:-30}
      # how long to wait before retrying a host already marked unavailable
      ZBX_UNAVAILABLEDELAY: ${ZBX_UNAVAILABLEDELAY:-60}

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:${ZABBIX_TAG:?err}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
      - proxy
    # traefik below is the normal way in; publish the port only for local debugging
    #ports:
    #  # outside:inside
    #  - ${APP_EXTERNAL_PORT:-8088}:8080
    environment:
      DB_SERVER_HOST: postgres
      POSTGRES_USER: ${STACKNAME:?err}
      POSTGRES_DB: ${STACKNAME:?err}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?err}
      ZBX_SERVER_HOST: zabbix-server
      PHP_TZ: Europe/Prague
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${STACKNAME:?err}-web.entrypoints=http"
      - "traefik.http.routers.${STACKNAME:?err}-web.rule=Host(`${APP_URL:?err}`)"
      - "traefik.http.middlewares.${STACKNAME:?err}-web-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.${STACKNAME:?err}-web-ipwhitelist.ipwhitelist.sourcerange=${APP_IP_WHITELIST:-0.0.0.0/0}"
      - "traefik.http.routers.${STACKNAME:?err}-web.middlewares=${STACKNAME:?err}-web-https-redirect"
      - "traefik.http.routers.${STACKNAME:?err}-web-secure.entrypoints=https"
      - "traefik.http.routers.${STACKNAME:?err}-web-secure.rule=Host(`${APP_URL:?err}`)"
      - "traefik.http.routers.${STACKNAME:?err}-web-secure.middlewares=${STACKNAME:?err}-web-ipwhitelist"
      - "traefik.http.routers.${STACKNAME:?err}-web-secure.tls=true"
      - "traefik.http.routers.${STACKNAME:?err}-web-secure.tls.certresolver=http"
      - "traefik.http.routers.${STACKNAME:?err}-web-secure.service=${STACKNAME:?err}-web"
      - "traefik.http.services.${STACKNAME:?err}-web.loadbalancer.server.port=8080"
      - "traefik.docker.network=proxy"

  zabbix-agent2:
    image: zabbix/zabbix-agent2:${ZABBIX_TAG:?err}
    restart: unless-stopped
    networks:
      - default
    environment:
      TZ: Europe/Prague
      # self-monitoring demo host — after the first start switch the "Zabbix server" host
      # interface to DNS zabbix-agent2:10050 (it defaults to 127.0.0.1)
      ZBX_HOSTNAME: "Zabbix server"
      ZBX_SERVER_HOST: zabbix-server

volumes:
  db:

networks:
  proxy:
    external: true
